<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Synthetic utility demonstration</title>
<desc id="desc">Dashboard summarizing synthetic federated accuracy, accuracy with noise standard deviation 0.10, and their utility delta. These are demonstration outputs, not privacy guarantees.</desc>
<rect width="1200" height="675" fill="#f8fafc"/>
<text x="60" y="78" font-family="Arial" font-size="38" font-weight="700" fill="#0f172a">Synthetic utility demonstration</text>
<text x="60" y="116" font-family="Arial" font-size="20" fill="#64748b">Seeded synthetic task · descriptive software output only</text>
<g font-family="Arial">
<rect x="70" y="185" width="320" height="210" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="105" y="235" font-size="20" fill="#475569">Federated accuracy</text><text x="105" y="320" font-size="62" font-weight="700" fill="#0f172a">0.770</text>
<rect x="440" y="185" width="320" height="210" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="475" y="225" font-size="20" fill="#475569">Accuracy with noise</text><text x="475" y="255" font-size="17" fill="#64748b">noise_std = 0.10</text><text x="475" y="330" font-size="62" font-weight="700" fill="#0f172a">0.769</text>
<rect x="810" y="185" width="320" height="210" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="845" y="235" font-size="20" fill="#475569">Utility delta</text><text x="845" y="320" font-size="62" font-weight="700" fill="#0f172a">0.001</text>
</g>
<rect x="120" y="470" width="960" height="110" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
<text x="600" y="512" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#9a3412">Not a differential-privacy result</text>
<text x="600" y="548" text-anchor="middle" font-family="Arial" font-size="18" fill="#7c2d12">No privacy accountant, ε/δ estimate, secure aggregation, or attack evaluation is included.</text>
</svg>